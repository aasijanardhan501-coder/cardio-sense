<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Flow Diagram</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .flow-container {
            background-color: #ffffff;
            width: 1100px;
            max-width: 100%;
            padding: 60px 40px;
            border-radius: 24px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.05);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
        }

        /* The Connecting Line Behind the Nodes */
        .connecting-line {
            position: absolute;
            top: 50%;
            left: 100px;
            right: 100px;
            height: 6px;
            background: #cbd5e1;
            z-index: 1;
            transform: translateY(-50%);
            border-radius: 10px;
        }

        /* Individual Flow Step */
        .flow-step {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 180px;
        }

        .step-circle {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
            position: relative;
        }

        .step-circle svg {
            width: 40px;
            height: 40px;
        }

        .step-number {
            position: absolute;
            top: -10px;
            right: -10px;
            background-color: #1e293b;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            border: 3px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .step-title {
            margin-top: 25px;
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .step-desc {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 500;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
            background: white;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #f1f5f9;
        }

        /* Specific Colors */
        .step-login { background: linear-gradient(135deg, #10b981, #059669); }
        .step-monitor { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .step-alert { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .step-report { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }

        /* Caption Placeholder */
        .caption {
            margin-top: 40px;
            font-size: 20px;
            font-weight: 600;
            color: #334155;
            background-color: white;
            border: 1px solid #cbd5e1;
            padding: 18px 50px;
            border-radius: 12px;
            box-shadow: 0 8px 15px -3px rgba(0, 0, 0, 0.05);
        }

        /* Corner Title */
        .diagram-title {
            position: absolute;
            top: 20px;
            left: 30px;
            font-size: 14px;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 2.5px;
        }

        /* Arrow SVG on line connecting dots */
        .line-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div class="flow-container">
        
        <div class="diagram-title">System User Flow</div>

        <!-- Horizontal line behind steps -->
        <div class="connecting-line"></div>

        <!-- Arrows floating on the line between nodes -->
        <svg class="line-arrow" style="left: 230px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <svg class="line-arrow" style="left: 520px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        <svg class="line-arrow" style="left: 810px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>

        <!-- Step 1: Login -->
        <div class="flow-step">
            <div class="step-circle step-login">
                <div class="step-number">1</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </div>
            <div class="step-title">Login</div>
            <div class="step-desc">Secure Google Auth</div>
        </div>

        <!-- Step 2: Monitor -->
        <div class="flow-step">
            <div class="step-circle step-monitor">
                <div class="step-number">2</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
            </div>
            <div class="step-title">Monitor</div>
            <div class="step-desc">Real-time Vitals DB</div>
        </div>

        <!-- Step 3: Alert -->
        <div class="flow-step">
            <div class="step-circle step-alert">
                <div class="step-number">3</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </div>
            <div class="step-title">Alert</div>
            <div class="step-desc">Push & Warning UI</div>
        </div>

        <!-- Step 4: Report -->
        <div class="flow-step">
            <div class="step-circle step-report">
                <div class="step-number">4</div>
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            </div>
            <div class="step-title">Report</div>
            <div class="step-desc">Link or PDF Share</div>
        </div>

    </div>

    <!-- Ready for Snapshot -->
    <div class="caption">Figure 2.7: User Flow of the System</div>

</body>
</html>
