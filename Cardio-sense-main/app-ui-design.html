<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App UI Design - Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* Mobile Device Frame */
        .phone-frame {
            background-color: #ffffff;
            width: 375px;
            height: 812px;
            border-radius: 45px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15), 0 0 0 12px #e2e8f0, 0 0 0 14px #cbd5e1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Top Status Bar Placeholder */
        .status-bar {
            padding: 16px 25px 10px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            color: #0f172a;
            z-index: 10;
        }

        .dynamic-island {
            width: 100px;
            height: 25px;
            background-color: #000;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
        }

        /* Header */
        .header {
            padding: 25px 25px 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .greeting {
            font-size: 14px;
            color: #64748b;
            font-weight: 500;
        }
        .user-name {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin: 2px 0 0 0;
            letter-spacing: -0.5px;
        }
        .profile-pic {
            width: 48px;
            height: 48px;
            background-color: #dbeafe;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563eb;
            border: 2px solid white;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* Vitals Hero Card (Heart Rate) */
        .vitals-card {
            margin: 10px 20px 20px 20px;
            background: linear-gradient(135deg, #ef4444, #b91c1c);
            border-radius: 28px;
            padding: 30px 25px;
            color: white;
            box-shadow: 0 15px 30px rgba(220, 38, 38, 0.25);
            position: relative;
            overflow: hidden;
        }
        .vitals-title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            opacity: 0.9;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .vitals-number {
            font-size: 64px;
            font-weight: 800;
            margin: 5px 0;
            display: flex;
            align-items: baseline;
            letter-spacing: -2px;
        }
        .vitals-unit {
            font-size: 20px;
            font-weight: 600;
            margin-left: 8px;
            opacity: 0.9;
            letter-spacing: 0;
        }
        .status-badge {
            display: inline-block;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(5px);
            margin-top: 5px;
        }
        
        /* Simulated ECG / Heartbeat Line */
        .ecg-line {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100px;
            opacity: 0.4;
        }

        /* Metrics Grid */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 0 20px;
        }
        .metric-box {
            background-color: #ffffff;
            border: 1px solid #f1f5f9;
            border-radius: 24px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }
        .metric-icon {
            margin-bottom: 12px;
            color: #3b82f6;
            background-color: #eff6ff;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .metric-label {
            font-size: 14px;
            color: #64748b;
            font-weight: 600;
        }
        .metric-value {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            margin-top: 4px;
        }

        /* Action Buttons */
        .actions {
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }
        .btn {
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s;
        }
        .btn-primary {
            background-color: #2563eb;
            color: white;
            box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
        }
        .btn-secondary {
            background-color: #f1f5f9;
            color: #334155;
            font-weight: 600;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            background-color: white;
            display: flex;
            justify-content: space-around;
            padding: 15px 0 25px 0;
            border-top: 1px solid #f1f5f9;
            margin-top: auto;
        }
        .nav-item {
            color: #94a3b8;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
        }
        .nav-item.active {
            color: #2563eb;
        }

        /* Generated Caption for User to Screenshot */
        .caption {
            margin-top: 40px;
            font-size: 18px;
            font-weight: 600;
            color: #475569;
            background-color: white;
            border: 1px solid #e2e8f0;
            padding: 15px 40px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="dynamic-island"></div>
        
        <!-- Status Bar -->
        <div class="status-bar">
            <span>9:41</span>
            <div style="display: flex; gap: 6px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21L15.6 16.2C14.6 15.4 13.4 15 12 15C10.6 15 9.4 15.4 8.4 16.2L12 21ZM12 3C7.9 3 4.2 4.6 1.4 7C0.8 7.5 0.7 8.4 1.2 9L2.8 11.2C3.3 11.8 4.1 11.9 4.7 11.4C6.7 9.9 9.2 9 12 9C14.8 9 17.3 9.9 19.3 11.4C19.9 11.9 20.7 11.8 21.2 11.2L22.8 9C23.3 8.4 23.2 7.5 22.6 7C19.8 4.6 16.1 3 12 3Z"/></svg>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2H10V4H8.33C7.6 4 7 4.6 7 5.33V20.67C7 21.4 7.6 22 8.33 22H15.67C16.4 22 17 21.4 17 20.67V5.33C17 4.6 16.4 4 15.67 4Z"/></svg>
            </div>
        </div>

        <!-- Header -->
        <div class="header">
            <div>
                <div class="greeting">Cardio-Sense Monitoring</div>
                <h1 class="user-name">Welcome, Thomas</h1>
            </div>
            <div class="profile-pic">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
        </div>

        <!-- Main Vitals Card -->
        <div class="vitals-card">
            <div class="vitals-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                Live Heart Rate
            </div>
            <div class="vitals-number">
                74 <span class="vitals-unit">BPM</span>
            </div>
            <div class="status-badge">● Normal Resting Rhythm</div>
            
            <!-- ECG Wave Simulator -->
            <svg class="ecg-line" viewBox="0 0 300 100" preserveAspectRatio="none">
                <path d="M0,70 L40,70 L55,40 L65,90 L85,15 L100,80 L115,70 L300,70" stroke="white" stroke-width="4" fill="none" stroke-linejoin="round"/>
            </svg>
        </div>

        <!-- Secondary Metrics Grid -->
        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
                </div>
                <div class="metric-label">Blood Pressure</div>
                <div class="metric-value">118<span style="font-size:16px;color:#94a3b8;font-weight:600;">/78</span></div>
            </div>
            <div class="metric-box">
                <div class="metric-icon" style="color: #059669; background-color: #d1fae5;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div class="metric-label">Daily Average</div>
                <div class="metric-value">121<span style="font-size:16px;color:#94a3b8;font-weight:600;">/80</span></div>
            </div>
        </div>

        <!-- Action Area -->
        <div class="actions">
            <div class="btn btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
                Manual Entry
            </div>
            <div class="btn btn-secondary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                Generate Physician Link
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-item active">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                Home
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                History
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                Alerts
            </div>
            <div class="nav-item">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Profile
            </div>
        </div>
    </div>

    <!-- Ready for Snapshot -->
    <div class="caption">Figure 2.5: High-Fidelity Prototype Interface</div>

</body>
</html>
